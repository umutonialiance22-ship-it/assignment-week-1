<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Recipe</title>
</head>
<body>

    <header>
        <h1>Chocolate Pancakes</h1>
    </header>

    <main>
        <section>
            <h2>Ingredients</h2>
            <ul>
                <li>2 cups flour</li>
                <li>1 cup milk</li>
                <li>2 eggs</li>
                <li>2 tablespoons cocoa powder</li>
            </ul>
        </section>

        <section>
            <h2>Preparation</h2>
            <p>Mix the ingredients and cook the pancakes on a hot pan.</p>
        </section>
    </main>

</body>
</html>
